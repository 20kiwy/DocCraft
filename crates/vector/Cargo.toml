[package]
name = "vector"
version.workspace = true
edition = "2021"
description = "Native Vector craft for DocCraft: an Adobe-Illustrator-style vector editor (shapes, bezier pen paths, freehand strokes, text) with a minimal hand-rolled SVG import/export."

[lib]
name = "vector"

[features]
default = ["json"]
json = ["dep:serde_json"]

[dependencies]
egui.workspace = true
serde_json = { workspace = true, optional = true }
roxmltree.workspace = true
