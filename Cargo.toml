[workspace]
resolver = "2"
members = [
    "app",
    "crates/theme",
    "crates/drawio",
    "crates/md",
    "crates/typeset",
    "crates/notes",
]
# The six real upstream craft systems live here as git submodules under
# `clone/` and keep their own workspaces; they are consumed as path
# dependencies from `app`.
exclude = ["clone"]

[workspace.package]
version = "3.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "glow",
    "accesskit",
    "wayland",
    "x11",
    "persistence",
    "links",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.19"

# ── The real storytold crafts (git submodules under clone/) ─────────────────
craft-ui          = { path = "clone/craft-libs/crates/ui" }
wordcraft-ui-egui = { path = "clone/wordcraft/crates/ui-egui" }
wordcraft-engine  = { path = "clone/wordcraft/crates/engine" }
gridcraft-ui-egui = { path = "clone/gridcraft/crates/ui-egui" }
gridcraft-engine  = { path = "clone/gridcraft/crates/engine" }
deckcraft-ui-egui = { path = "clone/deckcraft/crates/ui-egui" }
deckcraft-engine  = { path = "clone/deckcraft/crates/engine" }
pdfcraft-ui-egui  = { path = "clone/pdfcraft/crates/ui-egui" }
figcraft-ui-egui  = { path = "clone/figcraft/crates/ui-egui" }
figcraft-engine   = { path = "clone/figcraft/crates/engine" }
figcraft-color    = { path = "clone/figcraft/crates/color" }

# ── The new native DocCraft crafts ──────────────────────────────────────────
doccraft-theme    = { path = "crates/theme" }
doccraft-drawio   = { path = "crates/drawio" }
doccraft-md       = { path = "crates/md" }
doccraft-typeset  = { path = "crates/typeset" }
doccraft-notes    = { path = "crates/notes" }

# All crafts share ONE local craft-libs checkout, whatever revision each
# upstream repo pinned, so the whole suite links a single `craft-ui` (and the
# other craft-libs crates) instead of several conflicting git revisions.
[patch."https://github.com/storytold/craft-libs"]
craft-ui      = { path = "clone/craft-libs/crates/ui" }
craft-pdf     = { path = "clone/craft-libs/crates/pdf" }
craft-print   = { path = "clone/craft-libs/crates/print" }
craft-settings = { path = "clone/craft-libs/crates/settings" }
craft-quit    = { path = "clone/craft-libs/crates/quit" }
craft-atomic  = { path = "clone/craft-libs/crates/atomic" }
craft-docpath = { path = "clone/craft-libs/crates/docpath" }
craft-cms     = { path = "clone/craft-libs/crates/cms" }
craft-ai-core = { path = "clone/craft-libs/crates/ai-core" }

# The upstreams carry vendor forks of crates.io libraries with fixes they
# depend on (craft-pdf literally requires the patched krilla symbol). Route
# every consumer in the suite to the same forks.
[patch.crates-io]
krilla         = { path = "clone/craft-libs/vendor/krilla" }
hayro          = { path = "clone/pdfcraft/vendor/hayro" }
hayro-interpret = { path = "clone/pdfcraft/vendor/hayro-interpret" }
hayro-syntax   = { path = "clone/pdfcraft/vendor/hayro-syntax" }
hayro-jbig2    = { path = "clone/pdfcraft/vendor/hayro-jbig2" }
lopdf          = { path = "clone/pdfcraft/vendor/lopdf" }
vello_common   = { path = "clone/pdfcraft/vendor/vello_common" }

# Fast 2-core-friendly profile: same feature set as release, much cheaper to
# compile (opt 1, no LTO, many codegen units, incremental).
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
debug = false
strip = "debuginfo"
